title: Perf's blog
email: mperf21@proton.me
description: >-
  I'm Mattia Perfumo, a cybersecurity MSc student at KTH and former
  Cloud Security Intern at MongoDB. I share projects, technical notes,
  and CTF write-ups.
baseurl: ""
url: "https://mattiaperfumo.it"
lang: en

theme: minima
author:
  name: Mattia Perfumo
  email: mperf21@proton.me

minima:
  social_links:
    github: mperf
    instagram: mperff21
    youtube_channel: UC50xkdZn6v2iRTTlOn8nlYA
    youtube_channel_name: Mattia Perfumo
    linkedin: mattia-perfumo
    telegram: Perf21

header_pages:
  - index.html
  - about.markdown

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

disqus:
  shortname: mattiaperfumo

host: 0.0.0.0
port: 6942
permalink: /:title/
markdown: kramdown
show_excerpts: true
paginate: 4
paginate_path: "/blog/page:num/"
date_format: "%b %-d, %Y"

# Keep development files out of the generated site.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - script
  - vendor
